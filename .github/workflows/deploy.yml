name: Deploy Slides

on:
  push:
    branches: [ main ] # Passe 'main' an, falls dein Hauptbranch 'master' heißt

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Slidev with base path
        run: npx slidev build --base /docs/

      - name: Encrypt with StatiCrypt (Passwortschutz)
        run: npx staticrypt dist/index.html -p "UDOLINDE" -d dist --overwrite

      - name: Create .nojekyll to prevent 404/MIME errors
        run: touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
