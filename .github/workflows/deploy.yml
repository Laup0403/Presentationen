
name: Deploy Slidev to GitHub Pages

on:
  push:
    branches:
      - PB-8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: PB-8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Slidev
        run: npx slidev build --base /${{ github.event.repository.name }}/
  
      - name: Protect presentation with StatiCrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::STATICRYPT_PASSWORD secret is empty!"
            exit 1
          fi

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html not found!"
            exit 1
          fi

          npx --yes staticrypt dist/index.html --directory dist --config false

          if [ ! -f dist/index.html ]; then
            echo "::error::Encrypted index.html was not created!"
            exit 1
          fi


      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
